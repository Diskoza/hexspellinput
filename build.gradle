buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:6.0.+'
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

apply plugin: 'java'
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'

group = 'dev.diskozawr.hexspellinput'
version = '1.0.0'

base {
    archivesName = 'hexspellinput-forge-1.20.1'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

repositories {
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://maven.theillusivec4.top' }
    maven {
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content { includeGroup 'thedarkcolour' }
    }
    maven { url = 'https://maven.shedaniel.me/' }
    mavenCentral()
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                hexspellinput {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'

    compileOnly fg.deobf('at.petra-k.hexcasting:hexcasting-forge-1.20.1:0.11.3')
    runtimeOnly fg.deobf('at.petra-k.hexcasting:hexcasting-forge-1.20.1:0.11.3')
    runtimeOnly 'thedarkcolour:kotlinforforge:4.3.0'
    runtimeOnly fg.deobf('at.petra-k.paucal:paucal-forge-1.20.1:0.6.0-pre-118')
    runtimeOnly fg.deobf('vazkii.patchouli:Patchouli:1.20.1-83-FORGE-SNAPSHOT')
    runtimeOnly fg.deobf('top.theillusivec4.caelus:caelus-forge:3.1.0+1.20')
    runtimeOnly fg.deobf('com.samsthenerd.inline:inline-forge:1.20.1-1.0.1')
    runtimeOnly fg.deobf('me.shedaniel.cloth:cloth-config-forge:11.1.106')

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.jetbrains.kotlin:kotlin-stdlib:1.7.20'
    testImplementation fg.deobf('at.petra-k.hexcasting:hexcasting-forge-1.20.1:0.11.3')
}

mixin {
    add sourceSets.main, 'hexspellinput.refmap.json'
    config 'hexspellinput.mixins.json'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

jar {
    manifest {
        attributes([
            'MixinConfigs': 'hexspellinput.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}
